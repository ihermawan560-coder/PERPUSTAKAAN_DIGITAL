<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle decorative ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>

  <!-- Main Open Book Icon -->
  <g filter="url(#shadow)" transform="translate(64, 96)">
    <!-- Book Base / Pages Left -->
    <path d="M192 250 C140 220 60 220 20 230 L20 80 C60 70 140 70 192 100 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Book Base / Pages Right -->
    <path d="M192 250 C244 220 324 220 364 230 L364 80 C324 70 244 70 192 100 Z" fill="#f8fafc" stroke="#cbd5e1" stroke-width="4"/>
    
    <!-- Spine Line -->
    <path d="M192 100 L192 250" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>

    <!-- Left Book Text lines -->
    <line x1="50" y1="120" x2="160" y2="135" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="50" y1="150" x2="160" y2="165" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="50" y1="180" x2="140" y2="195" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Right Book Text lines -->
    <line x1="224" y1="135" x2="334" y2="120" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="224" y1="165" x2="334" y2="150" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <line x1="244" y1="195" x2="334" y2="180" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Golden Graduation Cap floating on top -->
    <g transform="translate(112, 10)">
      <polygon points="80,10 155,42 80,74 5,42" fill="url(#gold)"/>
      <path d="M35 55 L35 90 C35 110 125 110 125 90 L125 55" fill="none" stroke="url(#gold)" stroke-width="6"/>
      <circle cx="80" cy="42" r="5" fill="#ca8a04"/>
      <path d="M145 44 C155 70 160 85 158 95" fill="none" stroke="#ca8a04" stroke-width="4" stroke-linecap="round"/>
      <circle cx="158" cy="98" r="4" fill="#ca8a04"/>
    </g>

    <!-- Star / Sparkle badge -->
    <g transform="translate(192, 215) scale(0.9)">
      <circle cx="0" cy="0" r="28" fill="#f59e0b" stroke="#ffffff" stroke-width="4"/>
      <polygon points="0,-18 5,-5 18,-5 8,4 12,17 0,9 -12,17 -8,4 -18,-5 -5,-5" fill="#ffffff"/>
    </g>
  </g>

  <!-- School Branding Text inside icon -->
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="2">
    SMPN 3 RETEH
  </text>
  <text x="256" y="450" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#93c5fd" letter-spacing="1">
    PERPUSTAKAAN DIGITAL
  </text>
</svg>
